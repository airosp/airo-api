name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Formatação
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Os testes de base de dados levantam um Postgres 16 embutido, que o
      # próprio teste descarrega. Sem serviço no CI e sem Docker: um teste que
      # só corre em metade das máquinas não é um teste, é uma intenção.
      - name: Testes
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Esquema contra Postgres real
        run: go test ./internal/platform/postgres/ -run "Migration|Invariant" -v

      # Os invariantes são a suite que apanha a classe de erro que já apareceu:
      # repartições que não somam, progresso que recua, blocos que enchem antes
      # de tempo. Enquanto `internal/engine` não existir, o passo não tem nada
      # para correr — e um passo que falha por ausência de código não diz nada.
      - name: Invariantes
        run: |
          if [ -n "$(ls -A internal/engine 2>/dev/null)" ]; then
            go test ./internal/engine/... -run Invariant -v
          else
            echo "internal/engine ainda vazio — os invariantes entram na Fase 2."
          fi

      - name: Build
        run: go build ./...
