name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airo
          POSTGRES_PASSWORD: airo
          POSTGRES_DB: airo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Formatação
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Testes
        env:
          AIRO_DATABASE_URL: postgres://airo:airo@localhost:5432/airo_test?sslmode=disable
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Os invariantes são a suite que apanha a classe de erro que já apareceu:
      # repartições que não somam, progresso que recua, blocos que enchem antes
      # de tempo. Enquanto `internal/engine` não existir, o passo não tem nada
      # para correr — e um passo que falha por ausência de código não diz nada.
      - name: Invariantes
        run: |
          if [ -n "$(ls -A internal/engine 2>/dev/null)" ]; then
            go test ./internal/engine/... -run Invariant -v
          else
            echo "internal/engine ainda vazio — os invariantes entram na Fase 2."
          fi

      - name: Build
        run: go build ./...
